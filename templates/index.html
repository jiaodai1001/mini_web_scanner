<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Mini Web Scanner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg:           #f6f8fa;
            --surface:      #ffffff;
            --border:       #e5e7eb;
            --border-focus: #2563eb;
            --accent:       #2563eb;
            --accent-hover: #1d4ed8;
            --accent-soft:  #eff6ff;
            --danger:       #dc2626;
            --danger-soft:  #fef2f2;
            --warn:         #d97706;
            --warn-soft:    #fffbeb;
            --ok:           #16a34a;
            --ok-soft:      #f0fdf4;
            --text:         #111827;
            --text-2:       #374151;
            --text-3:       #6b7280;
            --text-4:       #9ca3af;
            --shadow-sm:    0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.05);
            --shadow-md:    0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);
            --radius:       10px;
            --mono: 'DM Mono', monospace;
            --sans: 'DM Sans', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-size: 16px;
            line-height: 1.6;
            min-height: 100vh;
            padding: 48px 24px 96px;
        }

        /* ─── Header ─── */
        .header {
            max-width: 780px;
            margin: 0 auto 32px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding-bottom: 22px;
            border-bottom: 1px solid var(--border);
        }

        .header-icon {
            width: 38px;
            height: 38px;
            background: var(--accent);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .header-icon svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #fff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.01em;
        }

        .header .version {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-3);
            background: var(--border);
            padding: 2px 9px;
            border-radius: 20px;
            margin-left: auto;
        }

        /* ─── Scan Card ─── */
        .scan-card {
            max-width: 780px;
            margin: 0 auto 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 22px 24px;
        }

        .scan-card label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-3);
            margin-bottom: 8px;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .scan-row {
            display: flex;
            gap: 10px;
        }

        .scan-row input {
            flex: 1;
            background: var(--surface);
            border: 1.5px solid var(--border);
            color: var(--text);
            font-family: var(--mono);
            font-size: 15px;
            padding: 11px 14px;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .scan-row input::placeholder { color: var(--text-4); }

        .scan-row input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(37,99,235,.11);
        }

        .btn-scan {
            background: var(--accent);
            color: #fff;
            font-family: var(--sans);
            font-weight: 600;
            font-size: 15px;
            padding: 11px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.14s, box-shadow 0.14s;
        }

        .btn-scan:hover  { background: var(--accent-hover); box-shadow: var(--shadow-sm); }
        .btn-scan:active { background: #1e40af; }
        .btn-scan:disabled { background: var(--text-4); cursor: not-allowed; box-shadow: none; }

        /* ─── Error Banner ─── */
        .error-banner {
            max-width: 780px;
            margin: 0 auto 18px;
            background: var(--danger-soft);
            border: 1px solid #fecaca;
            border-radius: var(--radius);
            padding: 12px 18px;
            font-size: 14px;
            color: var(--danger);
            display: none;
            align-items: center;
            gap: 8px;
        }

        .error-banner.visible { display: flex; }

        /* ─── Progress Panel ─── */
        .panel {
            max-width: 780px;
            margin: 0 auto 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 22px 24px;
            display: none;
        }

        .panel.visible { display: block; }

        .panel-title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: var(--text-3);
            margin-bottom: 16px;
        }

        .progress-wrap {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 99px;
            height: 8px;
            margin-bottom: 18px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), #60a5fa);
            border-radius: 99px;
            transition: width 0.4s ease;
        }

        /* Stage chips */
        .stages {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .stage-chip {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            color: var(--text-3);
            background: var(--bg);
            transition: all 0.16s;
        }

        .stage-chip.active {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-soft);
        }

        .stage-chip.done {
            border-color: #bbf7d0;
            color: var(--ok);
            background: var(--ok-soft);
        }

        /* Log stream */
        .log-stream {
            font-family: var(--mono);
            font-size: 13px;
            line-height: 1.75;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 12px 14px;
            min-height: 36px;
            max-height: 180px;
            overflow-y: auto;
        }

        .log-line {
            display: flex;
            gap: 14px;
            animation: fadeSlide 0.18s ease;
        }

        .log-line .ts  { color: var(--text-4); flex-shrink: 0; }
        .log-line .msg { color: var(--text-2); }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(3px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ─── Results ─── */
        .results-panel {
            max-width: 780px;
            margin: 0 auto;
            display: none;
        }

        .results-panel.visible { display: block; }

        /* Summary grid */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .summary-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 18px 20px;
            position: relative;
            overflow: hidden;
            transition: box-shadow 0.15s;
        }

        .summary-card:hover { box-shadow: var(--shadow-md); }

        /* Colored bottom strip */
        .summary-card::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 3px;
        }

        .summary-card.high::after   { background: var(--danger); }
        .summary-card.medium::after { background: var(--warn); }
        .summary-card.low::after    { background: var(--ok); }

        .card-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: var(--text-3);
            margin-bottom: 10px;
        }

        .card-count {
            font-size: 34px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.02em;
            margin-bottom: 5px;
        }

        .summary-card.high   .card-count { color: var(--danger); }
        .summary-card.medium .card-count { color: var(--warn); }
        .summary-card.low    .card-count { color: var(--ok); }

        .card-risk {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .summary-card.high   .card-risk { color: var(--danger); }
        .summary-card.medium .card-risk { color: var(--warn); }
        .summary-card.low    .card-risk { color: var(--ok); }

        /* Detail sections */
        .detail-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 10px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.15s;
        }

        .detail-section:hover { box-shadow: var(--shadow-md); }

        .detail-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            cursor: pointer;
            user-select: none;
            transition: background 0.12s;
        }

        .detail-header:hover { background: var(--bg); }

        .detail-badge {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 3px 9px;
            border-radius: 5px;
            flex-shrink: 0;
        }

        .badge-high   { background: var(--danger-soft); color: var(--danger); }
        .badge-medium { background: var(--warn-soft);   color: var(--warn); }
        .badge-low    { background: var(--ok-soft);     color: var(--ok); }

        .detail-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            flex: 1;
        }

        .detail-toggle {
            font-size: 11px;
            color: var(--text-4);
            transition: transform 0.2s;
        }

        .detail-section.open .detail-toggle { transform: rotate(180deg); }

        .detail-body {
            display: none;
            padding: 0 18px 16px;
            border-top: 1px solid var(--border);
        }

        .detail-section.open .detail-body { display: block; }

        .detail-body ul { list-style: none; padding-top: 4px; }

        .detail-body ul li {
            font-family: var(--mono);
            font-size: 13px;
            color: var(--text-2);
            padding: 9px 0;
            border-bottom: 1px solid var(--bg);
            display: flex;
            align-items: flex-start;
            gap: 10px;
            line-height: 1.6;
        }

        .detail-body ul li:last-child { border-bottom: none; }

        .detail-body ul li::before {
            content: '›';
            color: var(--accent);
            font-family: var(--sans);
            font-size: 16px;
            line-height: 1.45;
            flex-shrink: 0;
        }

        .detail-body .empty {
            font-size: 14px;
            color: var(--ok);
            padding: 14px 0 4px;
        }

        /* Download */
        .download-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 16px;
        }

        .btn-download {
            background: var(--surface);
            border: 1.5px solid var(--border);
            color: var(--text-2);
            font-family: var(--sans);
            font-size: 14px;
            font-weight: 500;
            padding: 9px 18px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: border-color 0.14s, color 0.14s, box-shadow 0.14s;
        }

        .btn-download:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: var(--shadow-sm);
        }

        /* Scrollbar */
        .log-stream::-webkit-scrollbar { width: 5px; }
        .log-stream::-webkit-scrollbar-track { background: transparent; }
        .log-stream::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
    </style>
</head>

<body>

    <div class="header">
        <div class="header-icon">
            <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
        </div>
        <h1>Web Vulnerability Scanner</h1>
        <span class="version">mini</span>
    </div>

    <div class="scan-card">
        <label for="urlInput">Target URL</label>
        <div class="scan-row">
            <input type="text" id="urlInput" placeholder="https://example.com" autocomplete="off">
            <button class="btn-scan" id="btnScan" onclick="startScan()">Start Scan</button>
        </div>
    </div>

    <div class="error-banner" id="errorBanner">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="errorText"></span>
    </div>

    <div class="panel" id="progressPanel">
        <div class="panel-title">Scan Progress</div>

        <div class="progress-wrap">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="stages" id="stagesRow">
            <div class="stage-chip" data-stage="crawler">Crawler</div>
            <div class="stage-chip" data-stage="params">Parameters</div>
            <div class="stage-chip" data-stage="plugins">Plugins</div>
            <div class="stage-chip" data-stage="scan">Scanning</div>
            <div class="stage-chip" data-stage="report">Report</div>
        </div>

        <div class="log-stream" id="logStream"></div>
    </div>

    <div class="results-panel" id="resultsPanel"></div>

</body>

<script>
    let _evtSource = null;

    function startScan() {
        const url = document.getElementById('urlInput').value.trim();
        if (!url) return;

        setError(null);
        showResults(null);
        resetProgress();

        document.getElementById('btnScan').disabled = true;
        document.getElementById('progressPanel').classList.add('visible');

        if (_evtSource) { _evtSource.close(); _evtSource = null; }

        fetch('/scan', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url })
        })
        .then(r => r.json())
        .then(data => {
            if (data.error) { setError(data.error); return; }
            subscribeProgress(data.scan_id);
        })
        .catch(err => setError('Failed to start scan: ' + err));
    }

    function subscribeProgress(scanId) {
        _evtSource = new EventSource(`/progress/${scanId}`);

        _evtSource.addEventListener('progress', e => {
            const d = JSON.parse(e.data);
            updateProgress(d.stage, d.message, d.percent);
        });

        _evtSource.addEventListener('done', e => {
            _evtSource.close();
            _evtSource = null;

            updateProgress('report', 'Scan complete!', 100);
            markAllDone();

            const report = JSON.parse(e.data);
            setTimeout(() => showResults(report), 400);
            document.getElementById('btnScan').disabled = false;
        });

        _evtSource.addEventListener('error', e => {
            _evtSource.close();
            _evtSource = null;

            let msg = 'An error occurred during the scan.';
            try { msg = JSON.parse(e.data).message; } catch(_) {}
            setError(msg);
            document.getElementById('btnScan').disabled = false;
        });

        _evtSource.onerror = () => {
            if (_evtSource && _evtSource.readyState === EventSource.CLOSED) {
                document.getElementById('btnScan').disabled = false;
            }
        };
    }

    // ─── Progress Helpers ───

    function resetProgress() {
        document.getElementById('progressBar').style.width = '0%';
        document.getElementById('logStream').innerHTML = '';
        document.querySelectorAll('.stage-chip').forEach(c => c.classList.remove('active', 'done'));
    }

    const _stageOrder = ['crawler', 'params', 'plugins', 'scan', 'report'];

    function updateProgress(stage, message, percent) {
        document.getElementById('progressBar').style.width = percent + '%';

        const idx = _stageOrder.indexOf(stage);
        document.querySelectorAll('.stage-chip').forEach(chip => {
            const si = _stageOrder.indexOf(chip.dataset.stage);
            chip.classList.remove('active', 'done');
            if (si < idx)      chip.classList.add('done');
            else if (si === idx) chip.classList.add('active');
        });

        const log = document.getElementById('logStream');
        const now = new Date().toLocaleTimeString('en-GB', { hour12: false });
        const line = document.createElement('div');
        line.className = 'log-line';
        line.innerHTML = `<span class="ts">${now}</span><span class="msg">${escHtml(message)}</span>`;
        log.appendChild(line);
        log.scrollTop = log.scrollHeight;
    }

    function markAllDone() {
        document.querySelectorAll('.stage-chip').forEach(c => {
            c.classList.remove('active');
            c.classList.add('done');
        });
    }

    // ─── Results Renderer ───

    function showResults(report) {
        const panel = document.getElementById('resultsPanel');

        if (!report) {
            panel.classList.remove('visible');
            panel.innerHTML = '';
            return;
        }

        const sections = [
            { key: 'sql_injection', label: 'SQL Injection',    emptyMsg: 'No SQL injection vulnerabilities detected.' },
            { key: 'xss',           label: 'XSS',              emptyMsg: 'No XSS vulnerabilities detected.' },
            { key: 'directories',   label: 'Directory Scan',   emptyMsg: 'No sensitive directories found.' },
            { key: 'headers',       label: 'Security Headers', emptyMsg: 'All important security headers are present.' },
        ];

        let cardsHtml = '<div class="summary-grid">';
        sections.forEach(s => {
            const data = report[s.key] || {};
            const risk = (data.risk || 'LOW').toUpperCase();
            const cls  = risk === 'HIGH' ? 'high' : risk === 'MEDIUM' ? 'medium' : 'low';
            cardsHtml += `
                <div class="summary-card ${cls}">
                    <div class="card-label">${s.label}</div>
                    <div class="card-count">${data.count ?? 0}</div>
                    <div class="card-risk">${risk}</div>
                </div>`;
        });
        cardsHtml += '</div>';

        let detailHtml = '';
        sections.forEach(s => {
            const data    = report[s.key] || {};
            const risk    = (data.risk || 'LOW').toUpperCase();
            const badgeCls = risk === 'HIGH' ? 'badge-high' : risk === 'MEDIUM' ? 'badge-medium' : 'badge-low';
            const details  = data.details || [];

            const bodyHtml = details.length === 0
                ? `<p class="empty">✔ ${s.emptyMsg}</p>`
                : '<ul>' + details.map(d => `<li>${escHtml(String(d))}</li>`).join('') + '</ul>';

            detailHtml += `
                <div class="detail-section" onclick="toggleSection(this)">
                    <div class="detail-header">
                        <span class="detail-badge ${badgeCls}">${risk}</span>
                        <span class="detail-title">${s.label}</span>
                        <span class="detail-toggle">▼</span>
                    </div>
                    <div class="detail-body">${bodyHtml}</div>
                </div>`;
        });

        const downloadHtml = `
            <div class="download-row">
                <a href="/download" class="btn-download">
                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Download JSON Report
                </a>
            </div>`;

        panel.innerHTML = cardsHtml + detailHtml + downloadHtml;
        panel.classList.add('visible');

        panel.querySelectorAll('.detail-section').forEach(sec => {
            if (sec.querySelector('.badge-high')) sec.classList.add('open');
        });
    }

    function toggleSection(el) { el.classList.toggle('open'); }

    function setError(msg) {
        const banner = document.getElementById('errorBanner');
        const text   = document.getElementById('errorText');
        if (!msg) {
            banner.classList.remove('visible');
            text.textContent = '';
        } else {
            text.textContent = msg;
            banner.classList.add('visible');
            document.getElementById('progressPanel').classList.remove('visible');
        }
    }

    function escHtml(str) {
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('urlInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') startScan();
        });
    });
</script>

</html>
